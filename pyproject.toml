[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scry"
version = "0.1.0"
description = "Magic: The Gathering card data and deck themes for AI agents, in as few tokens as possible"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "DATA_LICENSE"]
authors = [{ name = "Jeff Campbell" }]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Maintainers only: re-tagging cards with Jev. Users of scry never need it.
tag = ["decide @ git+https://github.com/jeffcampbell/Decide.git"]

[project.urls]
Homepage = "https://github.com/jeffcampbell/mtg-taxonomy"

[project.scripts]
scry = "scry.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
